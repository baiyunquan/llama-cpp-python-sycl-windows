name: Build Wheels (SYCL)

# 基于 sycl-build-guide.md 的手动编译流程自动化为 GitHub Actions。
# 触发方式：推送任意 tag（类似现有 Vulkan / CUDA wheel 工作流）。
# 产出：Windows x64 + Python 3.13 的自包含 SYCL wheel（方案 B，含 oneAPI 运行时 DLL，
#       目标机无需预装 oneAPI）。
#
# 关键点：
#   - oneAPI 2026.1 离线安装包（与 oneapi-ci build_all.yml 相同来源）
#   - 组件用冒号(:)分隔（Intel bootstrapper 要求，见 oneapi-ci#71）
#   - oneAPI 每次全新安装：GitHub cache 恢复会丢失 latest 符号链接/交接点，
#     导致 setvars 找不到 icx（已踩坑）；编译缓存改用 ccache（GGML_CCACHE=ON）
#   - scikit-build-core 固定 0.10.7（新版本在 SYCL 环境下有已知 bug）
#   - GGML_ONEDNN=off（兼容性更稳定）
#   - 修复 vendor/llama.cpp/common/jinja/utils.h 的 UTF-8 BOM（MSVC 中文编码问题）
#   - 方案 B：手动把 oneAPI 运行时 DLL（MKL/SYCL/OpenCL/OpenMP）复制进 llama_cpp/lib

on:
  push:
    tags:
      - '*'

permissions:
  contents: write

concurrency:
  group: sycl-build-${{ github.ref }}
  cancel-in-progress: true

env:
  # oneAPI 2026.1 offline installer（与 oneapi-ci 使用的来源一致）
  WINDOWS_TOOLKIT_URL: https://registrationcenter-download.intel.com/akdlm/IRC_NAS/4144bec3-82ce-4672-bd71-5c93a79cd5e7/intel-oneapi-toolkit-2026.1.0.191_offline.exe
  # SYCL 编译所需组件：编译器(SYCL 运行时 + DPC++ Library) + oneMKL + oneDNN + oneTBB
  # 注意：Intel Windows bootstrapper 的多组件分隔符是冒号(:) —— 见
  # https://github.com/oneapi-src/oneapi-ci/issues/71 （逗号/分号只会装第一个组件）
  WINDOWS_SYCL_COMPONENTS: intel.oneapi.win.cpp-dpcpp-common:intel.oneapi.win.mkl.devel:intel.oneapi.win.dnnl:intel.oneapi.win.tbb.devel

jobs:
  build_sycl_wheel:
    name: Build SYCL wheel on windows-2022
    runs-on: windows-2022
    timeout-minutes: 180

    steps:
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # Windows MAX_PATH 限制：llama.cpp 子模块含超深嵌套 UI 路径，
      # 必须先启用 git longpaths，否则 checkout 子模块报 "Filename too long"
      - name: Enable git long paths
        shell: pwsh
        run: git config --system core.longpaths true

      - uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      # 编译缓存：ccache 跨运行缓存 SYCL 编译产物，避免每次全量重编
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 2G

      # ---- Intel oneAPI（每次全新安装）------------------------------------
      # 不用 actions/cache 缓存 oneAPI：缓存恢复会丢失 latest 符号链接/交接点，
      # 导致 setvars 找不到 icx（已踩坑）。每次全新安装（约 5 分钟），
      # 编译缓存交给上面的 ccache。
      - name: Install Intel oneAPI (DPC++/C++, oneMKL, oneDNN, oneTBB)
        shell: bash
        run: oneapi-ci/scripts/install_windows.bat "$WINDOWS_TOOLKIT_URL" "$WINDOWS_SYCL_COMPONENTS"

      - name: Inspect oneAPI installation
        shell: pwsh
        run: |
          $root = 'C:\Program Files (x86)\Intel\oneAPI'
          if (Test-Path $root) {
            Write-Host '--- oneAPI root ---'
            Get-ChildItem $root | ForEach-Object { Write-Host "  $($_.Name)" }
            Write-Host '--- mkl ---'
            if (Test-Path "$root\mkl") {
              Get-ChildItem "$root\mkl" | ForEach-Object { Write-Host "  mkl/$($_.Name)" }
              Write-Host '--- mkl cmake ---'
              if (Test-Path "$root\mkl\latest\lib\cmake") {
                Get-ChildItem "$root\mkl\latest\lib\cmake" | ForEach-Object { Write-Host "  $($_.Name)" }
              } else { Write-Host '  mkl/latest/lib/cmake NOT found' }
            } else {
              Write-Host '  MKL NOT installed'
            }
            Write-Host '--- dnnl ---'
            if (Test-Path "$root\dnnl") { Write-Host '  dnnl installed' } else { Write-Host '  dnnl NOT installed' }
          } else {
            Write-Host "oneAPI root NOT found: $root"
          }

      # ---- 构建准备 --------------------------------------------------------
      - name: Install Python build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          # scikit-build-core 固定 0.10.7（新版本在 SYCL 环境存在兼容性问题）
          python -m pip install build wheel ninja scikit-build-core==0.10.7

      - name: Fix MSVC UTF-8 encoding (jinja utils.h)
        shell: pwsh
        run: |
          $path = 'llama-cpp-python/vendor/llama.cpp/common/jinja/utils.h'
          if (Test-Path $path) {
            $content = Get-Content -Path $path -Raw -Encoding UTF8
            $utf8bom = New-Object System.Text.UTF8Encoding $true
            [System.IO.File]::WriteAllText((Resolve-Path $path), $content, $utf8bom)
            Write-Host 'Converted utils.h to UTF-8 with BOM'
          } else {
            Write-Host 'utils.h not found, skipping encoding fix'
          }

      # scikit-build-core 0.10.7 不识别 -C version=，版本由 pyproject 配置的 regex
      # provider 从 llama_cpp/__init__.py 读取，因此直接改写 __version__ 为 <base>+sycl
      - name: Set wheel version (+sycl local tag)
        shell: pwsh
        run: |
          $path = 'llama-cpp-python/llama_cpp/__init__.py'
          $content = Get-Content -Path $path -Raw
          if ($content -match '__version__\s*=\s*"([^"]+)"') {
            $base = $Matches[1] -replace '\+.*$', ''
            $ver = "$base+sycl"
            $newContent = $content -replace '(?m)^__version__\s*=\s*"[^"]*"', "__version__ = `"$ver`""
            [System.IO.File]::WriteAllText((Resolve-Path $path), $newContent, [System.Text.UTF8Encoding]::new($false))
            Write-Host "Set __version__ to $ver in $path"
          } else {
            Write-Host '::error::Could not parse __version__ from llama_cpp/__init__.py'
            exit 1
          }

      # ---- SYCL 编译 --------------------------------------------------------
      - name: Build SYCL wheel
        shell: cmd
        run: |
          rem 全新安装后 setvars.bat 一定存在；--force 会顺带初始化 VS 环境
          call "C:\Program Files (x86)\Intel\oneAPI\setvars.bat" --force
          if errorlevel 1 exit /b 1
          icx --version
          set CMAKE_GENERATOR=Ninja
          set CMAKE_ARGS=-DCMAKE_BUILD_TYPE=Release -DGGML_SYCL=on -DGGML_ONEDNN=off -DGGML_CCACHE=ON -DCMAKE_C_COMPILER=icx -DCMAKE_CXX_COMPILER=icx -DGGML_SYCL_TARGET=INTEL -Wno-dev
          rem 让 CMake 能找到 oneMKL 的 MKLConfig.cmake
          set CMAKE_PREFIX_PATH=C:\Program Files (x86)\Intel\oneAPI\mkl\latest
          cd llama-cpp-python
          python -m build --wheel --no-isolation
          if errorlevel 1 exit /b 1
          cd ..

      # ---- 方案 B：构建完成后把 oneAPI 运行时 DLL 打进 wheel（自包含）------
      # CMake 的 $<TARGET_RUNTIME_DLLS> 无法捕获 MKL/SYCL 这些 imported 运行时库，
      # 因此构建完成后直接改写 wheel（zip 手术）：把 MKL/SYCL/OpenCL/OpenMP 运行时
      # DLL 塞进 llama_cpp/lib 并更新 RECORD，让目标机无需安装 oneAPI。
      - name: Bundle oneAPI runtime DLLs into wheel (self-contained)
        shell: bash
        run: |
          python - <<'PYEOF'
          import zipfile, shutil, os, sys, glob, hashlib, base64

          wheel = glob.glob('llama-cpp-python/dist/*.whl')[0]
          print('Processing wheel:', wheel)

          oneapi = r'C:\Program Files (x86)\Intel\oneAPI'
          lib_target = 'llama_cpp/lib/'

          dlls = []
          mkl_bin = os.path.join(oneapi, 'mkl', 'latest', 'bin')
          if os.path.isdir(mkl_bin):
              dlls += glob.glob(os.path.join(mkl_bin, 'mkl_*.dll'))
          comp_bin = os.path.join(oneapi, 'compiler', 'latest', 'bin')
          if os.path.isdir(comp_bin):
              dlls += glob.glob(os.path.join(comp_bin, 'sycl*.dll'))
              oc = os.path.join(comp_bin, 'OpenCL.dll')
              if os.path.isfile(oc):
                  dlls.append(oc)
          omp_bin = os.path.join(oneapi, 'compiler', 'latest', 'bin', 'compiler')
          if os.path.isdir(omp_bin):
              dlls += glob.glob(os.path.join(omp_bin, 'libomp*.dll'))

          seen, srcs = set(), []
          for d in dlls:
              b = os.path.basename(d)
              if b not in seen:
                  seen.add(b); srcs.append(d)
          print('Bundling DLLs:', [os.path.basename(d) for d in srcs])
          if not srcs:
              print('WARNING: no oneAPI runtime DLLs found to bundle'); sys.exit(0)

          tmp = os.path.join('llama-cpp-python', 'wheel_extract')
          shutil.rmtree(tmp, ignore_errors=True)
          os.makedirs(tmp, exist_ok=True)
          with zipfile.ZipFile(wheel) as zin:
              zin.extractall(tmp)

          for dll in srcs:
              dest = os.path.join(tmp, lib_target, os.path.basename(dll))
              os.makedirs(os.path.dirname(dest), exist_ok=True)
              shutil.copy2(dll, dest)

          # 更新 RECORD
          record_path = None
          for root, dirs, files in os.walk(tmp):
              if 'RECORD' in files:
                  record_path = os.path.join(root, 'RECORD')
          if record_path:
              with open(record_path, 'r', newline='') as rf:
                  lines = rf.read().splitlines()
              names = {line.split(',')[0] for line in lines}
              for dll in srcs:
                  rel = lib_target + os.path.basename(dll)
                  if rel in names:
                      continue
                  full = os.path.join(tmp, rel)
                  size = os.path.getsize(full)
                  h = hashlib.sha256()
                  with open(full, 'rb') as fh:
                      h.update(fh.read())
                  digest = base64.urlsafe_b64encode(h.digest()).decode().rstrip('=')
                  lines.append(f'{rel},sha256={digest},{size}')
              with open(record_path, 'w', newline='') as rf:
                  rf.write('\n'.join(lines) + '\n')

          # 重新打包 wheel（覆盖原文件）
          os.remove(wheel)
          with zipfile.ZipFile(wheel, 'w', zipfile.ZIP_DEFLATED) as zout:
              for root, dirs, files in os.walk(tmp):
                  for f in files:
                      full = os.path.join(root, f)
                      rel = os.path.relpath(full, tmp).replace('\\', '/')
                      zout.write(full, rel)
          shutil.rmtree(tmp, ignore_errors=True)

          # 复制最终 wheel 到 wheelhouse
          os.makedirs('wheelhouse', exist_ok=True)
          shutil.copy2(wheel, os.path.join('wheelhouse', os.path.basename(wheel)))
          print('Done. Final wheel:', os.path.basename(wheel), round(os.path.getsize(wheel)/1e6, 1), 'MB')
          PYEOF

      - name: Verify self-contained wheel
        shell: pwsh
        run: |
          $wheel = Get-ChildItem 'wheelhouse\*.whl' | Select-Object -First 1
          if (-not $wheel) { Write-Host '::error::No wheel produced'; exit 1 }
          Write-Host "Wheel: $($wheel.Name) ($([math]::Round($wheel.Length/1MB, 1)) MB)"
          $tmp = Join-Path $env:TEMP 'wheelcheck'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          Expand-Archive -Path $wheel.FullName -DestinationPath $tmp -Force
          $lib = Join-Path $tmp 'llama_cpp\lib'
          if (Test-Path $lib) {
            Get-ChildItem $lib -Filter *.dll | ForEach-Object { Write-Host "  $($_.Name)" }
          } else {
            Write-Host '  (no lib dir)'
          }
          Remove-Item $tmp -Recurse -Force

      - uses: actions/upload-artifact@v7
        with:
          name: wheels-sycl-windows-2022
          path: ./wheelhouse/*.whl
          if-no-files-found: error

  release:
    name: Release
    needs: [build_sycl_wheel]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest

    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
          path: dist

      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
